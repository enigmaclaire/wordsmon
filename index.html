<body>
<main id="teacher" class="teacher"><div class="teacher-box"><h1>WordsMon GO! 교사용 단어 관리</h1><p>CSV 형식: 정답,뜻,페이지,오답1,오답2</p><textarea id="teacherText"></textarea><input id="csv" type="file" accept=".csv,text/csv"><button class="teacher-save" id="save">단어 저장</button><button class="teacher-reset" id="reset">기본 단어</button></div></main>
<main id="start" class="screen start"><div class="start-inner"><img class="logo-img" src="assets/wordsmongo-logo-line.png"><p class="tagline">교과서에서 찾은 단어 몬스터를 잡아봐요!</p><div class="stage"><div class="start-monsters"><img class="start-monster m1" src="assets/monsters/fire.png"><img class="start-monster m2" src="assets/monsters/ghost.png"><img class="start-monster m3" src="assets/monsters/hedgehog.png"><img class="start-monster m4" src="assets/monsters/fish.png"><img class="start-monster m5" src="assets/monsters/cat.png"><img class="start-monster m6" src="assets/monsters/bee.png"></div><div class="trainer"><div class="trainer-main"><img id="trainerImg" src="assets/trainer-boy.png"></div><div class="trainer-options"><button class="trainer-choice selected" data-gender="boy"><img src="assets/trainer-boy.png">남자</button><button class="trainer-choice" data-gender="girl"><img src="assets/trainer-girl.png">여자</button></div></div><div class="friends"><img class="friend" src="assets/monsters/leaf.png"><img class="friend" src="assets/monsters/bear.png"><img class="friend" src="assets/monsters/flame.png"></div></div><form id="form" class="start-form"><label for="name">트레이너 이름</label><input id="name" placeholder="이름을 적어주세요" maxlength="12"><p class="hint">트레이너의 실제 이름을 바르게 적어주세요</p><button class="start-btn">WordsMon을 잡으러 출발!</button></form></div></main>
<main id="game" class="screen game"><div class="shell"><header class="game-head"><img class="game-logo" src="assets/wordsmongo-logo-line.png"><div class="title-badge">단어 몬스터를 잡아라!</div><div id="count" class="progress">0 / 9 잡음</div></header><section class="question"><small>아래의 뜻을 가진 단어 몬스터를 잡으세요!</small><div id="meaning" class="meaning"></div><div id="page" class="page"></div></section><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div id="ball" class="ball"></div></div></main>
<main id="bingo" class="screen bingo"><div class="shell"><header class="bingo-head"><img class="game-logo" src="assets/wordsmongo-logo-line.png"><h1 class="bingo-title">Battle 1 · Bingo</h1><div id="round" class="round">1 라운드</div></header><p class="subtitle">잡은 단어 몬스터를 빙고판에 배치해요!</p><div id="tokens" class="tokens"></div><div id="board" class="board"></div><button id="startBattle" class="battle-start">시작</button></div></main>
<main id="battle" class="screen battle"><div class="shell"><header class="bingo-head"><img class="game-logo" src="assets/wordsmongo-logo-line.png"><h1 class="bingo-title">Battle 1 · Bingo</h1><div id="battleRound" class="round">1 라운드</div></header><div id="timer" class="timer">0:40</div><section class="battle-card"><p>뜻에 맞는 단어 몬스터를 찾아요!</p><p id="battleMeaning" class="battle-meaning"></p></section><div id="battleBoard" class="board"></div></div></main>
<div id="complete" class="complete"><div class="complete-box"><div style="font-size:6rem">🎉</div><h2>단어 몬스터를 잡았어요!</h2><p id="completeText"></p><button id="retry">다시 도전하기</button><button id="goBingo">배틀 1으로 넘어가기</button></div></div>
<script>
var teacherAiStatus={set textContent(value){const statusNode=document.querySelector('.teacher-status');if(statusNode)statusNode.textContent=value}};
setTimeout(()=>{document.addEventListener('click',event=>{const retryButton=event.target.closest('.result-retry');if(!retryButton)return;event.preventDefault();event.stopImmediatePropagation();if(resultOverlay)resultOverlay.remove();activeRound=1;battleFinished=false;clearTimeout(timerId);$('game').classList.remove('show');$('battle').classList.remove('show');$('bingo').classList.add('show');document.querySelector('#bingo .bingo-title').textContent='Battle 1 · Bingo';$('round').textContent='1 라운드';setupBingo()},true)},900);
setTimeout(()=>{const bingoCellScaleStyle=document.createElement('style');bingoCellScaleStyle.textContent='.bingo .board{width:min(100%,680px)!important;gap:8px!important;padding:8px!important}.bingo .cell{min-height:92px!important;height:92px!important;padding:5px!important;font-size:1.25rem!important;border-width:3px!important}.bingo .cell img{height:56px!important}.bingo .battle-start{font-size:1.35rem!important;padding:8px 18px!important}';document.head.appendChild(bingoCellScaleStyle)},900);
setTimeout(()=>{const finalTeacherLayoutStyle=document.createElement('style');finalTeacherLayoutStyle.textContent='.teacher-top-row{transform:translateX(-3cm)!important}.teacher-box input[type=file]{height:56px!important;min-width:240px!important;font-size:1.05rem!important;padding:9px 14px!important}.teacher-box input[type=file]::file-selector-button{height:42px!important;padding:9px 18px!important;font-size:1.05rem!important;border:3px solid #fff!important;border-radius:15px!important;background:#72b9c9!important;color:#fff!important}';document.head.appendChild(finalTeacherLayoutStyle);const csvGuideNode=document.querySelector('.teacher-box .csv-guide');if(csvGuideNode)csvGuideNode.innerHTML='<span style="color:#fff;font-size:1.05em">⚪</span> 메모장이나 엑셀 파일에 단어, 뜻, 페이지를 입력하고 CSV UTF-8로 저장해 주세요.'},800);

on:`Bearer ${SB_KEY}`}})).json();rows.sort((a,b)=>(Number(b.success)-Number(a.success))||(Number(b.remaining_seconds)-Number(a.remaining_seconds))||(new Date(a.created_at)-new Date(b.created_at)));list.innerHTML=rows.slice(0,5).map((x,i)=>`<div>${i+1}. ${x.trainer_name} <span>${x.success?'성공':'실패'} · ${x.remaining_seconds}초</span></div>`).join('')||'아직 기록이 없어요'}catch(e){list.textContent='순위를 불러오지 못했어요'}};finishBattle=function(success,remaining){if(battleFinished)return;battleFinished=true;clearTimeout(timerId);saveGameResult(success,remaining);showGameResult(success,remaining)};startBattle=function(){if(timerId)clearTimeout(timerId);$('bingo').classList.remove('show');$('battle').classList.add('show');battleIndex=0;battleFinished=false;const limit=activeRound===2?30:40,end=Date.now()+limit*1000;document.querySelector('#battle .bingo-title').textContent=`Battle ${activeRound} · Bingo`;$('battleRound').textContent=`${activeRound} 라운드`;battleQuestionOrder=shuffle([...placed]);function tick(){const left=Math.max(0,end-Date.now()),seconds=Math.ceil(left/1000);$('timer').textContent=`0:${String(seconds).padStart(2,'0')}`;$('timer').style.setProperty('--time-scale',left/(limit*1000));if(left<=0)finishBattle(false,0);else timerId=setTimeout(tick,250)}tick();$('battleBoard').innerHTML=placed.map((i,s)=>`<button class="cell" data-i="${i}" data-s="${s}"><img src="${sprites[i%sprites.length]}">${wordData[i].answer}</button>`).join('');nextBattleQuestion();document.querySelectorAll('#battleBoard .cell').forEach(c=>c.onclick=()=>{});};

.winner-message{width:min(92vw,900px);padding:18px 28px 20px;border:4px solid #fff;border-radius:28px;background:rgba(255,253,248,.94);box-shadow:0 0 0 5px #69b879,0 10px 28px #123c6d88;text-align:center}
.winner-message h2{margin:0;color:#2f8658;font-size:clamp(1.45rem,3.5vw,2.7rem);line-height:1.25}
.winner-message p{margin:6px 0 0;color:#31596d;font-size:clamp(1rem,2vw,1.4rem);font-weight:800}
.winner-message button{margin-top:13px;padding:10px 22px;border:0;border-radius:22px;background:#70ae8b;color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer}
.winner-trainer-image{display:block;width:min(32vw,260px);height:min(36vh,300px);margin:0 auto 8px;object-fit:contain;filter:drop-shadow(0 6px 5px #234b4066)}
</style>
<script>
(()=>{
  document.addEventListener('click',event=>{
    const button=event.target.closest('.result-view');
    if(!button||!document.getElementById('matching')?.classList.contains('show'))return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if(resultOverlay)resultOverlay.remove();
    const winner=document.createElement('div');
    winner.className='winner-overlay';
    const name=(typeof trainer==='string'&&trainer.trim())?trainer.trim():'트레이너';
    const selectedImage=document.querySelector('.trainer-choice.selected img')||document.getElementById('trainerImg');
    const imageSrc=sessionStorage.getItem('wordsmon-selected-trainer')||selectedImage?.getAttribute('src')||'assets/trainer-boy.png';
    winner.innerHTML='<div class="winner-message"><img class="winner-trainer-image" src="'+imageSrc+'" alt="선택한 트레이너"><h2>'+name+'님은 최고의 WordsMon 트레이너입니다!</h2><p>짝 맞추기와 모든 배틀을 멋지게 완성했어요!</p><button>처음으로</button></div>';
    document.body.appendChild(winner);
    winner.querySelector('button').onclick=()=>location.href=location.pathname;
  },true);
})();
</script>
<script>
(()=>{
  const matchingSuccessTextPolish=showMatchingResult;
  showMatchingResult=(success,remaining)=>{
    matchingSuccessTextPolish(success,remaining);
    if(!success||!resultOverlay)return;
    const box=resultOverlay.querySelector('.result-box');
    const message=box?.querySelector('p');
    const view=box?.querySelector('.result-view');
    const home=box?.querySelector('.result-home');
    if(message)message.textContent=((typeof trainer==='string'&&trainer.trim())?trainer.trim()+' 트레이너, 잘했어요.':'트레이너, 잘했어요.');
    if(box&&view&&home)box.insertBefore(home,view);
  };
})();
</script>
<script>
(()=>{
  const originalStartMatchingSafe=startMatching;
  startMatching=()=>{
    if(typeof timerId!=='undefined'&&timerId){clearTimeout(timerId);timerId=null}
    if(typeof battleFinished!=='undefined')battleFinished=true;
    return originalStartMatchingSafe();
  };
  const originalFinishBattleSafe=finishBattle;
  finishBattle=(success,remaining)=>{
    if(document.getElementById('matching')?.classList.contains('show'))return;
    return originalFinishBattleSafe(success,remaining);
  };
})();
</script>
<script>
(()=>{
  const safeMatchingResult=showMatchingResult;
  showMatchingResult=(success,remaining)=>{
    if(!success&&document.getElementById('matching')?.classList.contains('show')&&typeof matchingGameEndTime!=='undefined'&&matchingGameEndTime>Date.now()+500)return;
    return safeMatchingResult(success,remaining)
  };
})();
</script>
<style>
.champion-result{display:flex;flex-direction:column;align-items:center;gap:8px}
.champion-result .champion-cup{font-size:4.2rem;line-height:1}
.champion-result .champion-trainer{width:min(42vw,230px);height:245px;object-fit:contain;filter:drop-shadow(0 5px 4px #4c7b5a55)}
.champion-result h2{max-width:560px!important;margin:4px auto!important;color:#2d7d54!important;font-size:clamp(1.35rem,3vw,2.15rem)!important;line-height:1.25}
.result-box .result-view{background:#f0ae3d!important}
</style>
<script>
(()=>{
  const previousMatchingResult=showMatchingResult;
  showMatchingResult=(success,remaining)=>{
    if(!success)return previousMatchingResult(success,remaining);
    previousMatchingResult(true,remaining);
    if(!resultOverlay)return;
    const trainerImage=document.getElementById('trainerImg');
    const trainerSrc=sessionStorage.getItem('wordsmon-selected-trainer')||trainerImage?.getAttribute('src')||'assets/trainer-boy.png';
    const box=resultOverlay.querySelector('.result-box');
    if(!box)return;
    box.innerHTML='<div class="result-emoji">🎉</div><h2>짝 맞추기 성공!</h2><p>모든 단어와 뜻을 맞췄어요!</p><button class="result-view">결과 보기</button><button class="result-home">처음으로</button>';
    box.querySelector('.result-view').onclick=()=>{
      box.innerHTML='<div class="champion-result"><div class="champion-cup">🏆</div><img class="champion-trainer" src="'+trainerSrc+'" alt="선택한 트레이너"><h2>당신의 최고의 WordsMon 트레이너가 되었습니다.</h2><p>'+((typeof trainer==='string'&&trainer.trim())?trainer.trim()+' 트레이너, 정말 멋져요!':'정말 멋져요!')+'</p><button class="result-home">처음으로</button></div>';
      box.querySelector('.result-home').onclick=()=>location.href=location.pathname;
    };
    box.querySelector('.result-home').onclick=()=>location.href=location.pathname;
  };
})();
</script>
<script>
(()=>{
  const finalMatchingResult=showMatchingResult;
  showMatchingResult=(success,remaining)=>{
    const result=finalMatchingResult(success,remaining);
    setTimeout(async()=>{
      const box=document.querySelector('.result-overlay .result-box');
      if(!box)return;
      let heading=box.querySelector('.ranking-title');
      if(!heading){heading=document.createElement('div');heading.className='ranking-title';box.appendChild(heading)}
      heading.textContent='짝 맞추기 현재 순위';
      let list=box.querySelector('.ranking-list');
      if(!list){list=document.createElement('div');list.className='ranking-list';box.appendChild(list)}
      try{
        const response=await fetch(`${SB_URL}/rest/v1/game_results?select=trainer_name,success,remaining_seconds,created_at&round_number=in.(2,3)&limit=1000`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});
        const rows=await response.json();
        const currentName=trainer||'트레이너';
        const currentSeconds=Math.max(0,Math.round(remaining));
        const now=Date.now();
        const deduped=rows.filter(row=>!(row.trainer_name===currentName&&Boolean(row.success)===Boolean(success)&&Number(row.remaining_seconds)===currentSeconds&&now-Date.parse(row.created_at||0)<15000));
        rows.length=0; rows.push(...deduped);
        rows.push({_current:true,trainer_name:currentName,success:Boolean(success),remaining_seconds:currentSeconds,created_at:new Date().toISOString()});
        rows.sort((a,b)=>(Number(b.success)-Number(a.success))||(Number(b.remaining_seconds)-Number(a.remaining_seconds))||(new Date(a.created_at)-new Date(b.created_at)));
        const rank=rows.findIndex(row=>row._current)+1;
        list.innerHTML=rows.slice(0,5).map((row,index)=>`<div>${index+1}. ${row.trainer_name} <span>${row.success?'성공':'실패'} · ${row.remaining_seconds}초</span></div>`).join('');
        let rankText=box.querySelector('.live-rank');
        if(!rankText){rankText=document.createElement('p');rankText.className='live-rank';box.appendChild(rankText)}
        rankText.textContent=`${trainer||'트레이너'} 트레이너님은 현재 ${rank}위입니다.`;
      }catch(error){list.textContent='순위를 불러오지 못했어요.'}
    },450);
    return result;
  };
})();
</script>
<script>
(()=>{
  const directMemoryResult=()=>{
    showMatchingResult=(success,remaining)=>{
      if(typeof matchingScreen!=='undefined'&&!matchingScreen.classList.contains('show'))return;
      const currentRecord={_current:true,trainer_name:trainer||'트레이너',success:Boolean(success),remaining_seconds:Math.max(0,Math.round(remaining)),created_at:new Date().toISOString()};
      const historyKey='wordsmon-memory-history';
      let localHistory=[];
      try{localHistory=JSON.parse(localStorage.getItem(historyKey)||'[]')}catch(error){localHistory=[]}
      localHistory.push({...currentRecord,_current:false});
      localStorage.setItem(historyKey,JSON.stringify(localHistory.slice(-1000)));
      fetch(`${SB_URL}/rest/v1/game_results`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({trainer_name:trainer||'트레이너',round_number:3,success:Boolean(success),remaining_seconds:Math.max(0,Math.round(remaining))})}).catch(()=>{});
      if(resultOverlay)resultOverlay.remove();
      resultOverlay=document.createElement('div');
      resultOverlay.className='result-overlay';
      resultOverlay.innerHTML='<div class="result-box"><div class="result-emoji">🎉</div><h2>짝 맞추기 성공!</h2><p>'+(trainer||'트레이너')+' 트레이너님, 잘했어요.</p><p class="result-time">남은 시간: '+Math.max(0,Math.round(remaining))+'초</p><div class="ranking-title">짝 맞추기 현재 순위</div><div class="ranking-list">순위를 불러오는 중...</div><p class="live-rank">현재 순위를 계산하고 있어요...</p><button class="result-view">결과 보기</button><button class="result-home">처음으로</button></div>';
      document.body.appendChild(resultOverlay);
      resultOverlay.querySelector('.result-home').onclick=()=>location.href=location.pathname;
      resultOverlay.querySelector('.result-view').onclick=()=>{
        const image=document.getElementById('trainerImg');
        const src=image?.getAttribute('src')||'assets/trainer-boy.png';
        const box=resultOverlay.querySelector('.result-box');
        box.innerHTML='<div class="champion-result"><div class="champion-cup">🏆</div><img class="champion-trainer" src="'+src+'" alt="선택한 트레이너"><h2>'+(trainer||'트레이너')+'님은 최고의 WordsMon 트레이너입니다!</h2><p>짝 맞추기와 모든 배틀을 멋지게 완성했어요!</p><button class="result-home">처음으로</button></div>';
        box.querySelector('.result-home').onclick=()=>location.href=location.pathname;
      };
      (async()=>{
        try{
          const response=await fetch(`${SB_URL}/rest/v1/game_results?select=trainer_name,success,remaining_seconds,created_at&round_number=eq.3&limit=1000`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});
          const serverRows=await response.json();
          const rows=[...serverRows,...localHistory.filter(localRow=>!(localRow.trainer_name===currentRecord.trainer_name&&Boolean(localRow.success)===Boolean(currentRecord.success)&&Number(localRow.remaining_seconds)===Number(currentRecord.remaining_seconds)&&Math.abs(Date.parse(localRow.created_at||0)-Date.parse(currentRecord.created_at||0))<30000)&&!serverRows.some(serverRow=>serverRow.trainer_name===localRow.trainer_name&&Boolean(serverRow.success)===Boolean(localRow.success)&&Number(serverRow.remaining_seconds)===Number(localRow.remaining_seconds)&&Math.abs(Date.parse(serverRow.created_at||0)-Date.parse(localRow.created_at||0))<30000))];
          rows.push(currentRecord);
          rows.sort((a,b)=>(Number(b.success)-Number(a.success))||(Number(b.remaining_seconds)-Number(a.remaining_seconds))||(new Date(a.created_at)-new Date(b.created_at)));
          const seenNames=new Set();
          const uniqueRows=rows.filter(row=>{const name=String(row.trainer_name||'').trim();if(seenNames.has(name))return false;seenNames.add(name);return true});
          rows.length=0; rows.push(...uniqueRows);
          const box=resultOverlay.querySelector('.result-box');
          box.querySelector('.ranking-list').innerHTML=rows.slice(0,5).map((row,index)=>`<div>${index+1}. ${row.trainer_name} <span>${row.success?'성공':'실패'} · ${row.remaining_seconds}초</span></div>`).join('');
          box.querySelector('.live-rank').textContent=`${trainer||'트레이너'} 트레이너님은 현재 ${rows.findIndex(row=>row._current)+1}위입니다.`;
        }catch(error){/* 결과창은 순위 조회 실패와 관계없이 표시 */}
      })();
    };
  };
  directMemoryResult();
})();
</script>

<script>

  document.addEventListener('click',event=>{

    if(!choice)return;
    const image=choice.querySelector('img');
    const src=image?.getAttribute('src');
    if(src)sessionStorage.setItem('wordsmon-selected-trainer',src);
  },true);
  const initial=document.querySelector('.trainer-choice.selected img')||document.getElementById('trainerImg');
  if(initial?.getAttribute('src'))sessionStorage.setItem('wordsmon-selected-trainer',initial.getAttribute('src'));

</script>
<script>
(()=>{
  const previousFinishWithCompleteRoundTwoResult=finishBattle;
  finishBattle=(success,remaining)=>{
    if(activeRound!==2||!success||document.getElementById('matching')?.classList.contains('show'))return previousFinishWithCompleteRoundTwoResult(success,remaining);
    if(battleFinished)return;
    battleFinished=true;
    clearTimeout(timerId);
    const seconds=Math.max(0,Math.round(remaining));
    fetch(`${SB_URL}/rest/v1/game_results`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({trainer_name:trainer||'트레이너',round_number:2,success:true,remaining_seconds:seconds})}).catch(()=>{});
    if(resultOverlay)resultOverlay.remove();
    resultOverlay=document.createElement('div');
    resultOverlay.className='result-overlay';
    resultOverlay.innerHTML='<div class="result-box"><div class="result-emoji">🎉</div><h2>배틀 1 · 2라운드 성공!</h2><p>빙고를 완성했어요!</p><p class="result-time">남은 시간: '+seconds+'초</p><div class="ranking-title">2라운드 현재까지의 순위</div><div class="ranking-list">순위를 불러오는 중...</div><p class="live-rank">현재 순위를 계산하고 있어요...</p><button class="result-memory">메모리 게임 시작</button><button class="result-home">처음으로</button></div>';
    document.body.appendChild(resultOverlay);
    resultOverlay.querySelector('.result-memory').onclick=()=>{resultOverlay.remove();startMatching()};
    resultOverlay.querySelector('.result-home').onclick=()=>location.href=location.pathname;
    (async()=>{
      try{
        const response=await fetch(`${SB_URL}/rest/v1/game_results?select=trainer_name,success,remaining_seconds,created_at&round_number=eq.2&limit=1000`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});
        const rows=await response.json();
        const currentName=trainer||'트레이너';
        const now=Date.now();
        const deduped=rows.filter(row=>!(row.trainer_name===currentName&&Boolean(row.success)&&Number(row.remaining_seconds)===seconds&&now-Date.parse(row.created_at||0)<15000));
        deduped.push({_current:true,trainer_name:currentName,success:true,remaining_seconds:seconds,created_at:new Date().toISOString()});
        deduped.sort((a,b)=>(Number(b.success)-Number(a.success))||(Number(b.remaining_seconds)-Number(a.remaining_seconds))||(new Date(a.created_at)-new Date(b.created_at)));
        if(!resultOverlay)return;
        const box=resultOverlay.querySelector('.result-box');
        box.querySelector('.ranking-list').innerHTML=deduped.slice(0,5).map((row,index)=>`<div>${index+1}. ${row.trainer_name} <span>성공 · ${row.remaining_seconds}초</span></div>`).join('');
        box.querySelector('.live-rank').textContent=`${currentName} 트레이너님은 ${deduped.findIndex(row=>row._current)+1}위입니다.`;
      }catch(error){}
    })();
  };
})();
</script>
<script>
(()=>{
  const winnerBackgroundByTrainer={boy:'assets/winner-boy.png',girl:'assets/winner-girl.png',bear:'assets/winner-bear.png',rabbit:'assets/winner-rabbit.png',panda:'assets/winner-panda.png'};
  const applyChosenWinnerBackground=()=>{
    const winner=document.querySelector('.winner-overlay');
    if(!winner)return;
    const selectedSrc=sessionStorage.getItem('wordsmon-selected-trainer')||document.getElementById('trainerImg')?.getAttribute('src')||'';
    const key=Object.keys(winnerBackgroundByTrainer).find(name=>selectedSrc.includes('trainer-'+name));
    const asset=winnerBackgroundByTrainer[key]||'assets/winner-background.png';
    winner.style.setProperty('background-image',`url("${asset}")`,'important');
    winner.style.setProperty('visibility','visible','important');
  };
  setInterval(applyChosenWinnerBackground,50);
  new MutationObserver(applyChosenWinnerBackground).observe(document.body,{childList:true,subtree:true});
  applyChosenWinnerBackground();
})();
</script>
